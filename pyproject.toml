[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pyexoj"
version = "0.1.0"
description = "Unofficial Python port of ExoJ 1.9.2: automated detection of exocytosis events in TIRF time series"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.10"
authors = [{name = "HEET-USGYM"}]
dependencies = ["numpy>=1.23", "scipy>=1.9"]
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.optional-dependencies]
tiff = ["tifffile"]
gpu = ["torch"]
test = ["pytest", "pandas", "tifffile"]

[project.scripts]
pyexoj = "pyexoj.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
